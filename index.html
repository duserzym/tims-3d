<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TIMS 3D — explodable thermal ionization mass spectrometer models</title>
    <meta name="description" content="Interactive, physically grounded three.js models of TIMS instruments: Isotopx Phoenix, Nu TIMS and Thermo Triton XT; Faraday cups and Johnson noise; Daly detector vs ion counter; ion-source lens tuning; filament configurations; total evaporation." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button id="navToggle" class="icon-btn" aria-label="Toggle scene list">☰</button>
        <div class="brand">
          <img class="brand-mark" src="./icon.svg" alt="" width="32" height="32" />
          <div>
            <div class="brand-title">TIMS&nbsp;3D</div>
            <div class="brand-sub" id="sceneTitle">Thermal ionization mass spectrometry</div>
          </div>
        </div>
        <div class="toolbar">
          <label class="explode" title="Explode the assembly (E / Shift+E)">
            <span>Explode</span>
            <input id="explode" type="range" min="0" max="1" step="0.001" value="0" />
            <output id="explodeVal">0%</output>
          </label>
          <button id="btnAnimate" class="chip" title="Animate explode/assemble">▶ Animate</button>
          <button id="btnLabels" class="chip on" title="Toggle labels (L)">Labels</button>
          <button id="btnXray" class="chip" title="See-through housings (X)">X-ray</button>
          <button id="btnBeam" class="chip on" title="Toggle ion beams (B)">Beams</button>
          <button id="btnBloom" class="chip on" title="Glow post-processing">Glow</button>
          <button id="btnReset" class="chip" title="Reset camera (R)">Reset view</button>
          <button id="btnShot" class="chip" title="Save PNG screenshot">PNG</button>
        </div>
      </header>
      <nav id="nav" aria-label="Scenes"></nav>
      <main id="viewport">
        <div id="loading" class="loading hidden"><div class="spinner"></div><span id="loadingText">Loading…</span></div>
        <div id="tooltip" class="tooltip hidden"></div>
        <div id="hint" class="hint">Drag to orbit · scroll to zoom · right-drag to pan · click a part for details</div>
      </main>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
